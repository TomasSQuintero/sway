# ~/.config/foot/foot.ini
# Converted from kitty.conf + Kanagawa Dragon theme

[main]
font=JetBrainsMono Nerd Font:size=12, UDEV Gothic:size=11
# font=AcPlus IBM VGA 8x16
# font=SFMono Nerd Font Mono:size=11
pad=10x10

[bell]
urgent=no
notify=no

[scrollback]
lines=2000
# kitty: scrollbar_width 0
indicator-position=none

[cursor]
style=underline
blink=yes
blink-rate=500

[csd]
preferred=none

[key-bindings]
spawn-terminal=Control+n

# --- Kanagawa Dragon ---
[colors-dark]
# (use [colors] instead if your foot is older than 1.24)
alpha=1.0
foreground=c5c9c5
background=181616
selection-foreground=c8c093
selection-background=2d4f67
cursor=181616 c8c093
urls=72a7bc

regular0=0d0c0c
regular1=c4746e
regular2=8a9a7b
regular3=c4b28a
regular4=8ba4b0
regular5=a292a3
regular6=8ea4a2
regular7=c8c093

bright0=a6a69c
bright1=e46876
bright2=87a987
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=c5c9c5

