# gaps
gaps inner 8
gaps outer 4

# border 
default_border pixel 3
default_floating_border pixel 2
smart_borders on

mouse_warping container

# class                 border   background text     indicator child_border
client.focused          #fabd2f  #fabd2f    #282828  #fabd2f   #fabd2f
client.focused_inactive #a89984  #a89984    #282828  #a89984   #a89984
client.unfocused        #a89984  #a89984    #282828  #a89984   #a89984

# window rules
for_window [app_id="bluetui"] floating enable, resize set 1200 800, move position center
