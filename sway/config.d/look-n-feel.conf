# gaps
gaps inner 8
gaps outer 4

# border 
default_border pixel 4
default_floating_border pixel 4
smart_borders on

mouse_warping container

set $focused_color   #B6927B
set $unfocused_color #625E5A 
set $text_color      #1D1C19

client.focused          $focused_color   $focused_color   $text_color $focused_color   $focused_color
client.focused_inactive $unfocused_color $unfocused_color $text_color $unfocused_color $unfocused_color
client.unfocused        $unfocused_color $unfocused_color $text_color $unfocused_color $unfocused_color

# window rules
for_window [app_id="bluetui"] floating enable, resize set 1200 800, move position center

